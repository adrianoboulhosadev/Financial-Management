# Reverse proxy da VPS (Nginx roda nativo no host, fora do Docker).
#
# Instalar na VPS:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/financial
#   sudo ln -s /etc/nginx/sites-available/financial /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ ESTE ARQUIVO É O BOOTSTRAP PRÉ-TLS, NÃO A CONFIG DE PRODUÇÃO.
#
# O certbot JÁ FOI APLICADO na VPS: quem serve hoje é a cópia em
# /etc/nginx/sites-available/, que o `certbot --nginx` reescreveu com o bloco
# `listen 443 ssl` (preservando os location daqui) e deixou o `listen 80` apenas
# redirecionando pra https.
#
# Ou seja: o `cp` acima SOBRESCREVE o trabalho do certbot e derruba o HTTPS.
# Se precisar mexer neste arquivo e reinstalar, o caminho é:
#   1. sudo cp deploy/nginx.conf /etc/nginx/sites-available/financial
#   2. sudo certbot --nginx -d financial-management.devedev.com
#      -> escolha REINSTALAR o certificado existente; "renovar" à toa gasta a
#         cota do Let's Encrypt (5 certificados duplicados por semana).
#
# E não apague o bloco `listen 80` achando que virou lixo depois do TLS: é por
# ele que a renovação responde o desafio HTTP-01 do Let's Encrypt.
server {
    listen 80;
    server_name financial-management.devedev.com;

    # Upload de comprovante aceita até 10 MB (e imagem até 5 MB). O default do
    # Nginx é 1 MB, então SEM isto uma foto de celular ou um PDF de comprovante
    # toma 413 no proxy e nem chega no backend.
    client_max_body_size 10m;

    # SSE do sininho (GET /api/notification/stream). Precisa de bloco PRÓPRIO:
    # é uma conexão longa que transmite aos poucos, e cada default do Nginx
    # atrapalha de um jeito diferente.
    #   - proxy_buffering off: ligado (default), o Nginx SEGURA os eventos no
    #     buffer e o navegador não recebe nada até encher — o sininho parece
    #     travado exatamente como antes de existir o push.
    #   - proxy_http_version 1.1 + Connection '': o default (1.0, com
    #     "Connection: close") não mantém o fluxo aberto.
    #   - proxy_read_timeout: o default de 60s derrubaria a conexão a cada
    #     minuto. Não quebra (o EventSource reconecta sozinho), mas seria uma
    #     reconexão por minuto, por usuário, à toa.
    # Match exato (`=`) tem prioridade sobre o `location /api/` abaixo, então
    # este bloco vence para essa URL específica.
    location = /api/notification/stream {
        proxy_pass http://127.0.0.1:5003/notification/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # /api/* -> backend (Nest, container em 127.0.0.1:5003).
    # Mesmo domínio pro front e pra API evita precisar de um segundo
    # subdomínio/certificado. NEXT_PUBLIC_API_URL deve apontar pra
    # http(s)://SEU_DOMINIO_OU_IP/api.
    location /api/ {
        proxy_pass http://127.0.0.1:5003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tudo o resto -> web (Next.js, container em 127.0.0.1:3005).
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
